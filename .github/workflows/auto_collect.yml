name: Auto-Collect Economic Data

on:
  schedule:
    # Runs every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch: # Allows you to run it manually anytime from the GitHub website

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas wbgapi

      - name: Run data extraction script
        run: |
          python extract_india_data.py

      - name: Commit and push updated CSV back to repo
        run: |
          git config --global user.name "Data Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add india_economic_data.csv
          git commit -m "Automated data update: $(date +'%Y-%m-%d')" || exit 0
          git push
